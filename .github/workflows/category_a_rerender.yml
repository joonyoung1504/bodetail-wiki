name: 카테고리 A 재렌더 (이미지/자막 수정 후)

# 이미지 교체나 자막/강조어 수정만 반영해서 다시 만들 때 사용.
# 유튜브 재다운로드, AssemblyAI, Claude API 호출 없음 — 빠르고 무료.
# 사전 조건: reels/latest_a/assets/ 와 reels/latest_a/direction_edit.json 이
#           이미 저장소에 있어야 함 (카테고리 A 릴스 생성을 최소 1회 실행한 뒤)
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치 (ffmpeg / 한글폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          fc-cache -f

      - name: 자막 폰트 설치 (Anton 볼드 / Playfair Display 이탤릭)
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/Anton-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf"
          curl -fsSL -o ~/.fonts/PlayfairDisplay-Italic.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"
          fc-cache -f ~/.fonts

      - name: 파이썬 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade requests

      - name: 재렌더 실행
        run: |
          python rerender_category_a.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "bodetail-bot"
          git config user.email "bodetail-bot@users.noreply.github.com"
          git add -A
          git commit -m "🎬 카테고리 A 재렌더 ($(date +%F))" || echo "변경 없음"
          git push
