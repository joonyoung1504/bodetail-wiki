name: 카테고리 A 릴스 생성

# 실행: Actions 탭 → "카테고리 A 릴스 생성" → Run workflow
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '소스 유튜브 URL (예: 데이비드 고긴스 인터뷰)'
        required: true
        default: ''
      bgm_youtube_url:
        description: 'BGM 유튜브 URL (비우면 reels/bgm 폴더의 mp3 사용)'
        required: false
        default: ''
      bgm_start_sec:
        description: 'BGM 트랙에서 몇 초 지점부터 쓸지 (그 지점부터 릴스 길이만큼 그대로 사용 / 비우면 자동으로 고조되는 구간 탐지)'
        required: false
        default: ''
      reel_duration:
        description: '릴스 길이(초)'
        required: false
        default: '20'
      beats_per_cut:
        description: '이미지 몇 박자마다 컷할지 (작을수록 빠른 교차편집)'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치 (ffmpeg / 한글폰트 / 오디오)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libsndfile1
          fc-cache -f

      - name: Deno 설치 (유튜브 다운로드용 JS 챌린지 해결기 — 2025.11 이후 yt-dlp 필수)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: 파이썬 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]" requests librosa soundfile numpy pillow

      - name: 설치 확인 (문제 생기면 이 로그로 진단)
        run: |
          deno --version
          yt-dlp --version

      - name: 카테고리 A 생성
        env:
          # ── 시크릿 (Settings → Secrets and variables → Actions) ──
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          ANTROPIC_API_KEY:   ${{ secrets.ANTROPIC_API_KEY }}   # H 빠진 오타 그대로 (릴스 전용)
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_COOKIES:    ${{ secrets.YOUTUBE_COOKIES }}
          # ── 실행 시 입력값 ──
          YOUTUBE_URL:     ${{ github.event.inputs.youtube_url }}
          BGM_YOUTUBE_URL: ${{ github.event.inputs.bgm_youtube_url }}
          BGM_START_SEC:   ${{ github.event.inputs.bgm_start_sec }}
          REEL_DURATION:   ${{ github.event.inputs.reel_duration }}
          BEATS_PER_CUT:   ${{ github.event.inputs.beats_per_cut }}
        run: |
          python generate_category_a.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "bodetail-bot"
          git config user.email "bodetail-bot@users.noreply.github.com"
          git add -A
          git commit -m "🎬 카테고리 A 릴스 생성 ($(date +%F))" || echo "변경 없음"
          git push
