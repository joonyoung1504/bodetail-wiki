name: 카테고리 A 릴스 생성

# 실행: Actions 탭 → "카테고리 A 릴스 생성" → Run workflow
on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '소스 유튜브 URL (예: 데이비드 고긴스 인터뷰)'
        required: true
        default: ''
      bgm_youtube_url:
        description: 'BGM 유튜브 URL (비우면 reels/bgm 폴더의 mp3 사용)'
        required: false
        default: ''
      bgm_start_sec:
        description: 'BGM 트랙에서 몇 초 지점부터 재생 시작할지 (그 지점부터 그대로 사용 / 비우면 자동으로 고조되는 구간 탐지)'
        required: false
        default: ''
      bgm_climax_sec:
        description: 'BGM 트랙에서 클라이맥스(커지는/효과 터지는) 지점이 몇 초인지 — bgm_start_sec와 독립적으로 지정. 비우면 자동탐지'
        required: false
        default: ''
      effect_type:
        description: '클라이맥스에서 적용할 효과: montage(이미지 교차편집) / bw(흑백 전환) / outro(로고 카드 + BGM 커짐)'
        required: false
        default: 'montage'
        type: choice
        options:
          - montage
          - bw
          - outro
      reel_duration:
        description: '릴스 길이(초)'
        required: false
        default: '20'
      quote_hint:
        description: '명대사 선정 힌트 — 원하는 주제/키워드/구절 (예: discipline, fuck your feelings). AI가 이 주제와 맞는 명대사를 우선 선택'
        required: false
        default: ''
      broll_mood:
        description: '몽타주 이미지 무드 (예: gym grind sweat / luxury watch suit / dark rain street). 비우면 dark moody cinematic'
        required: false
        default: ''
      no_voice:
        description: '음성/내레이션 없는 영상(달리기 영상 등)이면 true — 음성인식·AI구간선택 건너뛰고 BGM만 처음부터 끝까지'
        required: false
        default: 'false'
      advanced_opts:
        description: '세부옵션 (key=value; 세미콜론 구분): outro_sec=2.5; beats_per_cut=2; clip_start_sec=40; audio_mode=swell|mix; sub_y=50; broll_mode=montage|cutaway; cutaway_style=image|blackword; cutaway_sec=1.6; intro_black_sec=3; sub_mode=word|phrase; sub_scale=1.0; broll_keywords=man running dark,man boxing gym'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 패키지 설치 (ffmpeg / 한글폰트 / 오디오)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libsndfile1
          fc-cache -f

      - name: 자막 폰트 설치 (Anton 볼드 / Playfair Display 이탤릭)
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/Anton-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf"
          curl -fsSL -o ~/.fonts/PlayfairDisplay-Italic.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay-Italic%5Bwght%5D.ttf"
          fc-cache -f ~/.fonts

      - name: Deno 설치 (유튜브 다운로드용 JS 챌린지 해결기 — 2025.11 이후 yt-dlp 필수)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: 파이썬 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "yt-dlp[default]" requests librosa soundfile numpy pillow

      - name: 설치 확인 (문제 생기면 이 로그로 진단)
        run: |
          deno --version
          yt-dlp --version
          fc-match "Anton"
          fc-match "Playfair Display:italic"

      - name: 카테고리 A 생성
        env:
          # ── 시크릿 (Settings → Secrets and variables → Actions) ──
          ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
          ANTROPIC_API_KEY:   ${{ secrets.ANTROPIC_API_KEY }}   # H 빠진 오타 그대로 (릴스 전용)
          PEXELS_API_KEY:     ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_COOKIES:    ${{ secrets.YOUTUBE_COOKIES }}
          # ── 실행 시 입력값 ──
          YOUTUBE_URL:     ${{ github.event.inputs.youtube_url }}
          BGM_YOUTUBE_URL: ${{ github.event.inputs.bgm_youtube_url }}
          BGM_START_SEC:   ${{ github.event.inputs.bgm_start_sec }}
          BGM_CLIMAX_SEC:  ${{ github.event.inputs.bgm_climax_sec }}
          EFFECT_TYPE:     ${{ github.event.inputs.effect_type }}
          REEL_DURATION:   ${{ github.event.inputs.reel_duration }}
          QUOTE_HINT:      ${{ github.event.inputs.quote_hint }}
          BROLL_MOOD:      ${{ github.event.inputs.broll_mood }}
          NO_VOICE:        ${{ github.event.inputs.no_voice }}
          ADVANCED_OPTS:   ${{ github.event.inputs.advanced_opts }}
        run: |
          python generate_category_a.py

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "bodetail-bot"
          git config user.email "bodetail-bot@users.noreply.github.com"
          git add -A
          git commit -m "🎬 카테고리 A 릴스 생성 ($(date +%F))" || echo "변경 없음"
          git push
