name: bodetail Category A Reel

on:
  push:
    paths:
      - 'videos/inbox_a/**'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: '영상 유튜브 URL (여기 붙여넣으면 자동 다운로드)'
        required: false
        default: ''
      bgm_youtube_url:
        description: '배경음악 유튜브 URL (선택, 비우면 reels/bgm 폴더 음악 사용)'
        required: false
        default: ''
      reel_duration:
        description: '릴스 길이(초)'
        default: '45'
      beats_per_cut:
        description: '몇 박자마다 이미지 교체 (1=빠름, 2=보통, 4=느림)'
        default: '2'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          sudo apt-get install -y ffmpeg fonts-noto-cjk --fix-missing
          pip install requests librosa soundfile numpy yt-dlp

      - name: 카테고리 A 생성
        env:
          ASSEMBLYAI_API_KEY:  ${{ secrets.ASSEMBLYAI_API_KEY }}
          ANTROPIC_API_KEY:    ${{ secrets.ANTROPIC_API_KEY }}
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_URL:         ${{ github.event.inputs.youtube_url }}
          BGM_YOUTUBE_URL:     ${{ github.event.inputs.bgm_youtube_url }}
          YOUTUBE_COOKIES:     ${{ secrets.YOUTUBE_COOKIES }}
          REEL_DURATION:       ${{ github.event.inputs.reel_duration || '45' }}
          BEATS_PER_CUT:       ${{ github.event.inputs.beats_per_cut || '2' }}
        run: python generate_category_a.py

      - name: 결과 커밋
        run: |
          git config user.name  "bodetail-bot"
          git config user.email "bot@bodetail.com"
          git add reels/latest_a/ reels/category_a/ videos/archive_a/ videos/inbox_a/ reels/bgm/ || true
          git diff --cached --quiet || \
            git commit -m "🎬 [skip ci] Category A #${{ github.run_number }}"
          git push
