name: 리버니 네일 데일리 게시물
# 매일 아침 09:00 KST 자동 (UTC 00:00) + 수동 실행 지원
# ※ GitHub 무료 러너 특성상 몇 분 지연될 수 있음(보통 09:00~09:15 도착)
# 매일 자동 실행: 새 주제로 생성 → 카드 렌더 → content.json을 메일 발송(이미지 메일은 중단)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      topic_override:
        description: '주제 직접 지정 (비우면 오늘 날짜의 스케줄 주제 자동)'
        required: false
        default: ''
      rerender:
        description: '재렌더 모드 — content.json 수정본으로 다시 렌더 (AI 호출 없음, 사진 재사용): true / false'
        required: false
        default: 'false'
      skip_email:
        description: '이메일 발송 생략(테스트용): true / false'
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 한글 폰트 설치 (Noto Serif/Sans CJK)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: 감성 폰트 설치 (나눔펜 손글씨 + Playfair 세리프)
        run: |
          mkdir -p ~/.fonts
          curl -fsSL -o ~/.fonts/NanumPenScript-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumpenscript/NanumPenScript-Regular.ttf"
          curl -fsSL -o ~/.fonts/PlayfairDisplay-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf"
          fc-cache -f ~/.fonts
      - name: 파이썬 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow numpy
      - name: 게시물 생성 (+ 재렌더/이메일)
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTROPIC_API_KEY }}   # ⚠️ 오타 시크릿(H 빠짐) 그대로 사용 — repo에 등록된 값
          PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # MAIL_TO는 코드에 ulsanhsls12@naver.com으로 고정 — 시크릿 넘기지 않음(예전 주소로 새는 것 방지)
          TOPIC_OVERRIDE:     ${{ github.event.inputs.topic_override }}
          RERENDER:           ${{ github.event.inputs.rerender }}
          SKIP_EMAIL:         ${{ github.event.inputs.skip_email }}
        run: |
          python generate_nail_post.py
      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "bodetail-bot"
          git config user.email "bodetail-bot@users.noreply.github.com"
          git add -A
          git commit -m "🐰 리버니 네일 게시물 ($(date +%F))" || echo "변경 없음"
          git push
