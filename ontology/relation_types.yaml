# ontology/relation_types.yaml
#
# 이 위키의 노트 사이에서 실제로 쓰는 "타입 있는 관계" 정의.
# 노트 frontmatter의 relations: 필드는 이 목록에 있는 type만 쓸 수 있다.
# 사용법·frontmatter 형식은 WIKI-RULES.md §8 참조. 순회·영향분석은 scripts/impact.py.
#
# 2026-08-21 개정: on_change를 방향별로 분리했다. 이전엔 한 필드에 "source가
# 바뀌면"과 "target이 바뀌면"을 한 문단에 섞어 써서, impact.py가 문자열을 자르면
# 정작 필요한 문장이 잘려나가는 문제가 있었다(supersedes에서 실제로 발견).
#
# 필드
#   id                   관계 타입 이름 (frontmatter relations[].type 값)
#   description          무슨 관계인지
#   direction            "unidirectional" | "bidirectional" — 그래프 간선을 양쪽에
#                         다 심을지(무향 취급). query_direction과는 다른 축이다.
#   cardinality          한 노트가 이 타입으로 가질 수 있는 관계 수
#   query_direction      scripts/impact.py가 이 타입을 어느 조회 방향에서 보여줄지.
#                           incoming — "target을 조회했을 때 source를 보여준다"만 유의미
#                           outgoing — "source를 조회했을 때 target을 보여준다"만 유의미
#                           both     — 둘 다 유의미 (예: may_invalidate — 결정을 고치기
#                                     전에 무효화 가능성도 보고 싶고, 발견을 막 적었을
#                                     때 뭘 무효화하는지도 보고 싶다)
#   on_change_incoming   **target을 조회했을 때** 화면에 표시되는 노트(=source)에게
#                         주는 안내. "target이 바뀌었으니 source 쪽에서 뭘 확인해야
#                         하는지"만 담는다 — 반대 방향 얘기를 섞지 않는다.
#   on_change_outgoing   **source를 조회했을 때** 화면에 표시되는 노트(=target)에게
#                         주는 안내. "source가 왜/어떻게 target에 영향을 주는지"만
#                         담는다.
#   propagates           scripts/impact.py가 이 타입을 따라 depth를 더 전파할지.
#                         전파는 이 edge를 타고 들어온 그 "방향"으로만 계속된다
#                         (incoming으로 들어왔으면 다음 depth도 incoming으로만 확장).

schema_version: 2

relation_types:
  - id: supersedes
    description: >
      이 노트가 target 노트를 대체한다. target은 더 이상 최신 판단 근거가 아니다
      (완전히 폐기됐거나, 최소한 이 노트 쪽이 우선한다).
    direction: unidirectional
    cardinality: "1:N"
    query_direction: incoming
    on_change_incoming: >
      target(방금 조회한 이 노트)을 실수로 다시 수정했다면, 이를 대체한 노트(아래
      표시된 노트)와 내용이 어긋나므로 그쪽도 확인이 필요합니다.
    on_change_outgoing: >
      target(아래 표시된 노트)은 이미 대체된 낡은 노트라 원칙적으로 재검토
      불필요합니다.
    propagates: true

  - id: depends_on
    description: >
      이 노트의 내용 일부가 target 노트의 내용을 전제로 성립한다. target이 바뀌면
      이 노트도 맞는지 다시 봐야 한다.
    direction: unidirectional
    cardinality: "N:N"
    query_direction: incoming
    on_change_incoming: >
      target(방금 조회한 이 노트)이 바뀌었으니, 이를 전제로 쓴 노트(아래 표시된
      노트)에서 해당 부분을 다시 확인하세요. 예: brand/브랜드-정체성.md의 컬러
      팔레트 섹션은 brand/DESIGN-bodetail-B-realphoto.md의 colors: 값에
      depends_on — DESIGN 쪽 컬러가 바뀌면 팔레트 섹션도 갱신해야 한다.
    on_change_outgoing: >
      아래 표시된 노트(target)를 전제로 삼고 있습니다 — 그 노트가 최신 상태인지
      확인 후 이 노트를 진행하세요.
    propagates: true

  - id: may_invalidate
    description: >
      이 노트가 담은 사실·발견이 target 노트의 어떤 결정/가정을 무효화할 수 있다.
      skuradar류 프로젝트의 relations.yaml에 있는 "가정이 틀리면 결론도 틀리다"
      패턴과 동일한 목적.
    direction: unidirectional
    cardinality: "N:N"
    query_direction: both
    on_change_incoming: >
      이 결정(방금 조회한 이 노트)을 고치기 전에, 무효화 가능성을 제기한 노트(아래
      표시된 노트)가 있는지 확인하세요.
    on_change_outgoing: >
      방금 조회한 이 노트가 담은 발견이 아래 표시된 노트(target)의 결정을
      무효화할 수 있습니다 — target이 여전히 유효한지 사람이 판단하세요. 자동으로
      무효 처리하지 않습니다. 예: decisions/사지방기간-시행착오-교훈.md(실제로는
      Ollama 하이브리드가 아니라 GitHub Actions+힉스필드로 갔다는 발견)가
      decisions/주요-의사결정.md의 "Claude Code 단일 → Ollama 하이브리드" 항목을
      may_invalidate한다.
    propagates: false   # 무효화 "가능성"은 한 단계만 보면 됨 — 연쇄 추정은 과함

  - id: derived_from
    description: >
      이 노트는 target(대개 raw/의 원본 자료)을 정리·가공해서 만들어졌다.
    direction: unidirectional
    cardinality: "N:1"
    query_direction: incoming
    on_change_incoming: >
      원본(방금 조회한 이 노트)이 보강됐으니, 파생된 노트(아래 표시된 노트)가 새
      내용을 반영했는지 확인하세요.
    on_change_outgoing: >
      아래 표시된 노트(원본)에서 파생된 내용입니다 — 원본이 나중에 바뀌어도 이
      노트가 자동으로 갱신되진 않으니 필요하면 직접 대조하세요.
    propagates: false   # raw/는 여러 노트의 공통 조상이라 전파하면 부채질만 커짐

  - id: implements
    description: >
      이 노트가 설명하는 코드/시스템/규칙이 target 노트(대개 decisions/의 결정)를
      실제로 구현한다.
    direction: unidirectional
    cardinality: "N:N"
    query_direction: both
    on_change_incoming: >
      이 결정(방금 조회한 이 노트)이 바뀌었으니, 이를 구현한 노트(아래 표시된
      노트)가 여전히 일치하는지 확인하세요.
    on_change_outgoing: >
      이 구현이 아래 표시된 노트(target, 결정)와 여전히 일치하는지 확인하세요 —
      결정은 바뀌었는데 구현은 옛날 그대로인 드리프트가 가장 위험합니다. 예:
      marketing_auto/MA_05_데일리포스트생성기.md가
      decisions/표지헤드라인-강제고정.md를 implements — 그 결정이 수정되면
      generate_daily_post.py 코드가 실제로 반영했는지 봐야 한다.
    propagates: true

  - id: complements
    description: >
      두 노트가 같은 대상을 다른 각도에서 다룬다. 어느 쪽도 다른 쪽을 대체하지
      않고, 서로 참고만 하면 된다 — 5개 기본 타입만으로는 이 "대등한 보완" 관계를
      표현할 수 없어서 실제 사례(세르칸 벤치마크 두 노트)를 보고 추가했다.
    direction: bidirectional
    cardinality: "N:N"
    query_direction: incoming   # bidirectional이라 그래프에 이미 양쪽으로 심어짐
    on_change_incoming: >
      검토 불필요 — 참고만 하면 되는 대등한 보완 관계입니다. 예:
      market/세르칸-벤치마킹-분석.md(계정 프로필·실측 데이터)와
      content/벤치마크-세르칸-미넨스.md(카드뉴스 구조 장치)는 같은 계정을 다른
      층위에서 다룰 뿐 서로 대체하지 않는다.
    on_change_outgoing: >
      검토 불필요 — 참고만 하면 되는 대등한 보완 관계입니다.
    propagates: false
